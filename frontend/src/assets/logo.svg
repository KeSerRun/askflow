<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 31 138 138" role="img" aria-label="AskFlow">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4734e"/>
      <stop offset="100%" style="stop-color:#b85a3a"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e08a65"/>
      <stop offset="100%" style="stop-color:#d4734e"/>
    </linearGradient>
  </defs>

  <!-- Logo 图标：六边形结构 + 波纹感（只保留图形，品牌名由界面按 APP_NAME 渲染） -->
  <g transform="translate(55, 100)">
    <!-- 最外层波纹环 -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#d4734e" stroke-width="1.5" opacity="0.12"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#d4734e" stroke-width="2" opacity="0.2"/>

    <!-- 六边形连接骨架 -->
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#d4734e" stroke-width="2.5" opacity="0.2"/>
    <line x1="-36.4" y1="-21" x2="36.4" y2="21" stroke="#d4734e" stroke-width="2.5" opacity="0.2"/>
    <line x1="-36.4" y1="21" x2="36.4" y2="-21" stroke="#d4734e" stroke-width="2.5" opacity="0.2"/>

    <!-- 数据核心（中心） -->
    <circle cx="0" cy="0" r="20" fill="url(#brandGrad)"/>
    <circle cx="0" cy="0" r="8" fill="#fff" opacity="0.95"/>
    <circle cx="0" cy="0" r="3.5" fill="#d4734e"/>

    <!-- 外层6个数据节点 -->
    <circle cx="0" cy="-42" r="9" fill="url(#nodeGrad)"/>
    <circle cx="36.4" cy="-21" r="9" fill="url(#nodeGrad)"/>
    <circle cx="36.4" cy="21" r="9" fill="url(#nodeGrad)"/>
    <circle cx="0" cy="42" r="9" fill="url(#nodeGrad)"/>
    <circle cx="-36.4" cy="21" r="9" fill="url(#nodeGrad)"/>
    <circle cx="-36.4" cy="-21" r="9" fill="url(#nodeGrad)"/>

    <!-- 内层次级数据点 -->
    <circle cx="-18" cy="-7" r="4.5" fill="#d4734e" opacity="0.45"/>
    <circle cx="18" cy="-7" r="4.5" fill="#d4734e" opacity="0.45"/>
    <circle cx="-18" cy="7" r="4.5" fill="#d4734e" opacity="0.45"/>
    <circle cx="18" cy="7" r="4.5" fill="#d4734e" opacity="0.45"/>

    <!-- 高光 -->
    <circle cx="8" cy="-8" r="35" fill="#fff" opacity="0.06"/>
  </g>
</svg>
