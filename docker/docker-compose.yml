# ════════════════════════════════════════════════════════════════
# AskFlow 基础设施编排
# 包含: MinIO + etcd + Milvus + Attu + Embedding(Chinese-CLIP) + MinerU(纯 CPU) + SearXNG
#        + MySQL + Redis（默认启动；便于随时把配置切到 mysql/redis 连接源）
# 仅生产（--profile prod）追加: Backend 容器
# 本地后端（`python app.py`）默认 sqlite + inprocess，但也可改配置连上面的 mysql/redis。
#
# 用法（在 docker/ 目录下）:
#   cd docker && docker compose up -d               # 起全部基础设施（含 MySQL/Redis）
#   # 或从项目根: docker compose -f docker/docker-compose.yml up -d
#   # 生产后端容器: docker compose --profile prod up -d --build
#
# 生产环境配置:
#   后端配置在**构建时**由 Dockerfile 把 backend/.env.prod 复制为镜像内的 .env。
#   即：容器内应用读/写 /workspace/backend/.env；后台“系统设置”保存即热重载生效
#   （注意容器内非持久，`up --build` 重建后回到 .env.prod 的内容）。
#   改生产配置 → 改 backend/.env.prod → 重新 build。本地开发 `python app.py` 读 backend/.env。
#
# 数据卷: 全部以 bind mount 挂载在 docker/data/<服务>/ 下，
#         数据可见、可直接备份/迁移、便于随项目携带。
#
# 端口:
#   MySQL      3306
#   Redis      6379
#   MinIO      9000/9001   (控制台: http://localhost:9001)
#   Milvus     19530/9091
#   Attu       3000        (Milvus 管理台: http://localhost:3000)
#   Embedding  7997       (本地 Chinese-CLIP 图文嵌入服务, OpenAI 兼容 + 图片嵌入)
#   MinerU     8000/7860   (文档解析 API / WebUI，默认启动，纯 CPU)
#   Backend    11000       (仅 --profile prod)
# ════════════════════════════════════════════════════════════════

name: askflow

services:
  # ────────────────────────────────────────────────
  # MySQL 8 —— 用户/会话/对话历史 元数据
  # ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: askflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-askflow}
      MYSQL_USER: ${MYSQL_USER:-askflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-askflow_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 放宽连接上限，避免多 worker / 大并发压测打爆 max_connections
      - --max-connections=1000
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ────────────────────────────────────────────────
  # Redis 7 —— 工具缓存 / 任务进度 / 会话状态
  # ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: askflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ────────────────────────────────────────────────
  # MinIO —— 对象存储（上传 PDF + MinerU 解析产物 + Milvus 数据）
  # ────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: askflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"   # API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # 控制台
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  # 初始化 bucket（等待 MinIO 就绪后创建）
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set rag http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 2; done;
      mc mb --ignore-existing rag/rag-files;
      mc mb --ignore-existing rag/milvus-data;
      echo 'MinIO buckets ready: rag-files / milvus-data';
      "

  # ────────────────────────────────────────────────
  # etcd —— Milvus 元数据存储（milvus standalone 依赖）
  # ────────────────────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: askflow-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ./data/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ────────────────────────────────────────────────
  # Milvus —— 向量数据库（复用上面的 MinIO 存储 segment）
  # ────────────────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: askflow-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # 复用 MinIO（bucket: milvus-data），密钥需与 MinIO 一致
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESSKEYID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRETACCESSKEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKETNAME: milvus-data
      MINIO_USESSL: "false"
      # 关闭鉴权（开发环境），生产建议开启并配 COMMON_SECURITY_AUTHORIZATIONENABLED
      COMMON_SECURITY_AUTHORIZATIONENABLED: "false"
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    volumes:
      - ./data/milvus:/var/lib/milvus
    healthcheck:
      # 9091 是 Milvus standalone 的健康端口；就绪前返回非 200
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ────────────────────────────────────────────────
  # Attu —— Milvus 官方管理台（GUI）
  # 访问: http://localhost:${ATTU_PORT:-3000}
  # Milvus 未开鉴权（COMMON_SECURITY_AUTHORIZATIONENABLED=false）时，账号密码留空即可。
  # ────────────────────────────────────────────────
  attu:
    image: zilliz/attu:v2.4.8
    container_name: askflow-attu
    restart: unless-stopped
    ports:
      - "${ATTU_PORT:-3000}:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy

  # ────────────────────────────────────────────────
  # Embedding —— 图文嵌入服务（Chinese-CLIP，纯 CPU，OpenAI 兼容 + 图片嵌入）
  # 后端经 EMBED_BASE_URL -> http://embedding:80/v1/embeddings 访问（文本，容器内 80 端口）；
  # 图片嵌入走 /v1/image_embeddings（图搜文用）。
  # 维度 512 与 CLIP 模型一致；模型缓存到 ./data/clip，之后可离线运行。
  # ────────────────────────────────────────────────
  embedding:
    build: ./clip-api
    image: askflow/clip-api:1.0
    container_name: askflow-embedding
    restart: unless-stopped
    environment:
      CLIP_MODEL: ${CLIP_MODEL:-OFA-Sys/chinese-clip-vit-base-patch16}
      HF_HOME: /data
      # 预热：1=后台线程预热（默认，启动不被阻塞，模型在后台提前加载好）；0=完全关闭
      CLIP_WARMUP: ${CLIP_WARMUP:-1}
      # 离线与否由入口脚本自动判断：模型已缓存→完全离线；未缓存→联网下载一次（无需手工设 HF_HUB_OFFLINE）
    ports:
      - "${EMBED_PORT:-7997}:80"
    volumes:
      - ./data/clip:/data
    healthcheck:
      # 镜像无 curl/wget，改用自带 python 探活 /health；首启下载/加载 CLIP 模型较慢，start_period 留足
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:80/health',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s

  # ────────────────────────────────────────────────
  # MinerU —— 本地文档解析服务（默认启动，纯 CPU，无需 GPU）
  # 镜像由本目录 docker/mineru/Dockerfile 构建（MinerU 4.x 基础包，CPU 可跑）。
  # backend 容器（同网络）可通过服务名访问: http://mineru-api:8000
  # ────────────────────────────────────────────────
  mineru-api:
    image: ${MINERU_IMAGE:-askflow/mineru-cpu:4}
    build:
      context: ./mineru
      dockerfile: Dockerfile
    container_name: askflow-mineru-api
    restart: unless-stopped
    ports:
      - "${MINERU_API_PORT:-8000}:8000"
    environment:
      # 模型源: modelscope（国内）/ huggingface（国际）/ local（仅用已下载模型）
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}
      MINERU_HOME: /root/.mineru
    entrypoint: ["mineru-kit"]
    command:
      - api-server
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # CPU 档位: basic（小模型，快）/ standard（加 VLM，质量更高但慢，约需 8GB 内存）
      - --tier
      - ${MINERU_TIER:-basic}
      # 需要鉴权时启用（AskFlow 侧 MINERU_API_KEY 需填同一个 Key）
      # - --api-key
      # - ${MINERU_API_KEY:-}
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    volumes:
      # MinerU_HOME：模型缓存 + 文档库，持久化避免每次重启重新下载
      - ./data/mineru-home:/root/.mineru
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s   # CPU 首启/首次下载模型较慢，留足冷启动时间

  # MinerU WebUI（Gradio）—— 上传 PDF 验证 / 使用解析效果，默认启动
  mineru-webui:
    image: ${MINERU_IMAGE:-askflow/mineru-cpu:4}
    build:
      context: ./mineru
      dockerfile: Dockerfile
    container_name: askflow-mineru-webui
    restart: unless-stopped
    ports:
      - "${MINERU_WEBUI_PORT:-7860}:7860"
    environment:
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}
      MINERU_HOME: /root/.mineru
    entrypoint: ["mineru-kit"]
    command:
      - webui
      - --server-name
      - 0.0.0.0
      - --server-port
      - "7860"
      # 复用 mineru-api，不再单独跑解析服务（避免重复占用内存/重复下载模型）
      - --api-url
      - http://mineru-api:8000
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    volumes:
      - ./data/mineru-home:/root/.mineru
    depends_on:
      mineru-api:
        condition: service_healthy

  # ────────────────────────────────────────────────
  # SearXNG —— 元搜索引擎（web_search 工具的后端，聚合上游引擎无需 API Key）
  # backend 默认按 SEARCH_SEARXNG_URL 访问；生产容器内经服务名互联。
  # ────────────────────────────────────────────────
  searxng:
    image: searxng/searxng
    container_name: askflow-searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./data/searxng:/etc/searxng
      # 运行缓存（镜像声明了 VOLUME /var/cache/searxng）：显式 bind 到 data，避免自动生成匿名卷
      - ./data/searxng/cache:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: "http://localhost:${SEARXNG_PORT:-8888}/"
    # 限流 / JSON 格式等行为在 ./data/searxng/settings.yml 中配置
    healthcheck:
      # 镜像内无 curl，用自带 wget 探活 /healthz
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────
  # Backend —— FastAPI 后端（生产容器化）
  # 使用 profiles: 默认不启动（开发时本地跑 python app.py）；
  # 生产用 `docker compose --profile prod up -d` 启用。
  #
  # 配置方式：**构建时把 backend/.env.prod 复制为镜像内的 .env**（见 Dockerfile），
  #   容器内应用读取 /workspace/backend/.env；不使用 env_file/environment 注入
  #   （否则环境变量优先级高于 .env 文件，后台“系统设置”保存会无法覆盖）。
  #   后台“系统设置”保存会写回容器内的 .env 并热重载生效；
  #   注意：容器内该文件非持久，`up --build` 重建后会恢复为镜像里的 .env.prod 内容。
  #   改生产配置请改 backend/.env.prod 后重新 build。
  # ────────────────────────────────────────────────
  backend:
    profiles: ["prod"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: askflow-backend
    restart: unless-stopped
    volumes:
      # 运行时数据（向量库/上传/日志）
      - ./data/backend:/workspace/backend/data
    ports:
      - "${BACKEND_PORT:-11000}:11000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      embedding:
        condition: service_healthy
      mineru-api:
        condition: service_healthy
      searxng:
        condition: service_healthy
